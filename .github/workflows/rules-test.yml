name: rules-emulator-tests

on:
  workflow_dispatch:
  push:
    branches:
      - 'ci/rules-emulator-tests'
  pull_request:
    paths:
      - 'firestore.rules.phase8b5.3.integrated.candidate'
      - 'storage.rules.phase8b5.4.integrated.candidate'
      - 'firebase.emulator.test.json'
      - 'tests/**'
      - 'src/**'
      - 'package.json'
      - 'package-lock.json'
      - '.github/workflows/rules-test.yml'

permissions:
  contents: read

jobs:
  rules-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      GCLOUD_PROJECT: demo-seeraai-test
      FIRESTORE_CANDIDATE: firestore.rules.phase8b5.3.integrated.candidate
      STORAGE_CANDIDATE: storage.rules.phase8b5.4.integrated.candidate
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - name: Install dependencies from lockfile
        id: install
        run: npm ci

      - name: Ensure Firebase CLI is available
        id: cli
        run: |
          if ! command -v firebase >/dev/null 2>&1; then
            npm install -g firebase-tools@13
          fi

      - name: Guard - isolated config and candidate integrity check
        id: guard
        run: |
          set -euo pipefail
          test -f "$FIRESTORE_CANDIDATE"
          test -f "$STORAGE_CANDIDATE"
          test -f firebase.emulator.test.json
          grep -q "$FIRESTORE_CANDIDATE" firebase.emulator.test.json
          grep -q "$STORAGE_CANDIDATE" firebase.emulator.test.json
          if grep -rq "leafy-rush-xvd6f" firebase.emulator.test.json tests "$FIRESTORE_CANDIDATE" "$STORAGE_CANDIDATE" 2>/dev/null; then
            echo "Production project ID found in test setup"; exit 1
          fi

      - name: Prepare evidence folder and hashes (before)
        id: prep_evidence
        if: ${{ steps.guard.outcome == 'success' }}
        run: |
          mkdir -p evidence
          sha256sum "$FIRESTORE_CANDIDATE" "$STORAGE_CANDIDATE" | tee evidence/hashes_before.txt
          firebase --version | tee evidence/tool_versions.txt
          java -version 2>> evidence/tool_versions.txt
          node -v >> evidence/tool_versions.txt
          npm -v >> evidence/tool_versions.txt

      - name: Run TypeScript & Production Build Check
        id: build_check
        if: ${{ steps.install.outcome == 'success' && steps.guard.outcome == 'success' && steps.prep_evidence.outcome == 'success' }}
        run: |
          set -o pipefail
          npx tsc --noEmit 2>&1 | tee evidence/tsc_output.txt
          npm run build 2>&1 | tee evidence/build_output.txt

      - name: Run Firestore rules tests in emulator
        id: firestore_tests
        if: ${{ !cancelled() && steps.install.outcome == 'success' && steps.cli.outcome == 'success' && steps.guard.outcome == 'success' && steps.prep_evidence.outcome == 'success' && steps.build_check.outcome == 'success' }}
        run: |
          set +e
          set -o pipefail
          firebase emulators:exec \
            --config firebase.emulator.test.json \
            --project demo-seeraai-test \
            --only firestore,storage \
            "npm run test:firestore" 2>&1 | tee evidence/firestore_output.txt
          statuses=("${PIPESTATUS[@]}")
          em_code="${statuses[0]:-1}"
          tee_code="${statuses[1]:-0}"
          if [ "$em_code" -ne 0 ]; then
            echo "$em_code" > evidence/firestore_exit_code.txt
          elif [ "$tee_code" -ne 0 ]; then
            echo "$tee_code" > evidence/firestore_exit_code.txt
          else
            echo "0" > evidence/firestore_exit_code.txt
          fi
          exit 0

      - name: Run Storage rules tests in emulator
        id: storage_tests
        if: ${{ !cancelled() && steps.install.outcome == 'success' && steps.cli.outcome == 'success' && steps.guard.outcome == 'success' && steps.prep_evidence.outcome == 'success' && steps.build_check.outcome == 'success' }}
        run: |
          set +e
          set -o pipefail
          firebase emulators:exec \
            --config firebase.emulator.test.json \
            --project demo-seeraai-test \
            --only firestore,storage \
            "npm run test:storage" 2>&1 | tee evidence/storage_output.txt
          statuses=("${PIPESTATUS[@]}")
          em_code="${statuses[0]:-1}"
          tee_code="${statuses[1]:-0}"
          if [ "$em_code" -ne 0 ]; then
            echo "$em_code" > evidence/storage_exit_code.txt
          elif [ "$tee_code" -ne 0 ]; then
            echo "$tee_code" > evidence/storage_exit_code.txt
          else
            echo "0" > evidence/storage_exit_code.txt
          fi
          exit 0

      - name: Hashes (after) and unchanged check
        id: hash_check
        if: ${{ !cancelled() && steps.guard.outcome == 'success' && steps.prep_evidence.outcome == 'success' }}
        run: |
          sha256sum "$FIRESTORE_CANDIDATE" "$STORAGE_CANDIDATE" | tee evidence/hashes_after.txt
          diff evidence/hashes_before.txt evidence/hashes_after.txt \
            && echo "HASHES UNCHANGED" | tee evidence/hash_check.txt \
            || { echo "HASHES CHANGED" | tee evidence/hash_check.txt; exit 1; }
          cp -f firebase-debug.log firestore-debug.log storage-debug.log ui-debug.log evidence/ 2>/dev/null || true

      - name: Upload evidence
        if: ${{ !cancelled() && steps.guard.outcome == 'success' && steps.prep_evidence.outcome == 'success' }}
        uses: actions/upload-artifact@v4
        with:
          name: rules-test-evidence
          path: evidence/
          if-no-files-found: error

      - name: Fail job if either test suite failed
        if: ${{ !cancelled() && steps.install.outcome == 'success' && steps.cli.outcome == 'success' && steps.guard.outcome == 'success' && steps.prep_evidence.outcome == 'success' && steps.build_check.outcome == 'success' }}
        run: |
          test -s evidence/firestore_exit_code.txt
          test -s evidence/storage_exit_code.txt
          fs_code="$(tr -d '[:space:]' < evidence/firestore_exit_code.txt)"
          st_code="$(tr -d '[:space:]' < evidence/storage_exit_code.txt)"
          echo "Firestore exit code: $fs_code"
          echo "Storage exit code: $st_code"
          test "$fs_code" = "0" && test "$st_code" = "0"
