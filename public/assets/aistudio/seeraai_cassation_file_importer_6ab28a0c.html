<!doctype html>
<html lang="om">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#1e1b4b">
  <title>SEERAAI PRO — Cassation Index Importer X20</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://cdn.jsdelivr.net/npm/mammoth@1.9.0/mammoth.browser.min.js"></script>
  <link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;700&family=Noto+Sans+Ethiopic:wght@400;700;900&family=Inter:wght@400;700;900&display=swap" rel="stylesheet">
  <style>
    :root { color-scheme: dark light; }
    .dark body { background-color: #0f172a; color: #f8fafc; }
    .dark .bg-white { background-color: #1e293b; border-color: #334155; }
    .dark .text-slate-900 { color: #f8fafc; }
    .dark .text-slate-800 { color: #e2e8f0; }
    .dark .text-slate-400 { color: #94a3b8; }
    .dark .bg-slate-50 { background-color: #0f172a; }
    .dark .border-slate-200 { border-color: #334155; }
    
    body { font-family: 'Inter', 'Noto Sans Ethiopic', sans-serif; transition: background-color 0.3s; }
    .drop-zone { border: 2px dashed #6366f1; transition: all 0.2s cubic-bezier(0.4, 0, 0.2, 1); }
    .drop-zone.dragover { border-color: #4f46e5; background: rgba(99, 102, 241, 0.1); transform: scale(1.01); }
    .case-card { animation: slideUp 0.3s ease-out; border-left: 4px solid transparent; }
    .case-card:hover { border-left-color: #6366f1; }
    @keyframes slideUp { from {opacity:0; transform:translateY(10px)} to {opacity:1; transform:translateY(0)} }
    .mono { font-family: 'JetBrains Mono', monospace; }
    .custom-scrollbar::-webkit-scrollbar { width: 6px; }
    .custom-scrollbar::-webkit-scrollbar-track { background: transparent; }
    .custom-scrollbar::-webkit-scrollbar-thumb { background: #6366f1; border-radius: 10px; }
    .sticky-header { position: sticky; top: 0; z-index: 40; backdrop-filter: blur(12px); }
  </style>
</head>
<body class="min-h-screen bg-slate-50 text-slate-900 selection:bg-indigo-100 selection:text-indigo-900">
  <header class="bg-indigo-950 text-white shadow-2xl sticky-header border-b border-indigo-800">
    <div class="mx-auto max-w-[1600px] px-6 py-4">
      <div class="flex flex-col gap-4 md:flex-row md:items-center md:justify-between">
        <div class="flex items-center gap-4">
          <div class="bg-indigo-600 p-2.5 rounded-2xl shadow-inner">
            <svg class="w-8 h-8 text-white" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2.5" d="M19 11H5m14 0a2 2 0 012 2v6a2 2 0 01-2 2H5a2 2 0 01-2-2v-6a2 2 0 012-2m14 0V9a2 2 0 00-2-2M5 11V9a2 2 0 012-2m0 0V5a2 2 0 012-2h6a2 2 0 012 2v2M7 7h10"/></svg>
          </div>
          <div>
            <div class="text-[10px] font-black uppercase tracking-[.3em] text-indigo-400">SEERAAI PRO ARCHIVE</div>
            <h1 class="text-xl font-black tracking-tight flex items-center gap-2">
              Cassation Intelligence Importer
              <span class="text-[10px] bg-indigo-500/20 text-indigo-300 px-2 py-0.5 rounded-full border border-indigo-500/30">X20 ELITE</span>
            </h1>
          </div>
        </div>
        <div class="flex items-center gap-3">
           <button id="themeToggle" class="p-2 rounded-xl bg-white/5 hover:bg-white/10 transition-all">🌙</button>
           <button id="clearBtn" class="bg-rose-600/10 hover:bg-rose-600/20 text-rose-400 px-4 py-2 rounded-xl text-[10px] font-black uppercase transition-all border border-rose-500/20">Clear System</button>
           <div class="hidden xl:block text-right border-l border-white/10 pl-4">
             <div id="connectionStatus" class="text-[10px] font-black text-emerald-400 flex items-center justify-end gap-1.5 uppercase tracking-widest">
               <span class="w-1.5 h-1.5 rounded-full bg-emerald-500 animate-pulse"></span>
               Local Engine Active
             </div>
           </div>
        </div>
      </div>
    </div>
  </header>

  <main class="mx-auto max-w-[1600px] grid grid-cols-1 lg:grid-cols-12 gap-8 p-6">
    <aside class="lg:col-span-4 space-y-6">
      <div class="bg-white rounded-[2rem] border border-slate-200 p-6 shadow-xl">
        <h2 class="text-sm font-black uppercase tracking-widest text-slate-400 mb-6 flex items-center gap-2">
          <span class="w-8 h-px bg-indigo-200"></span> 01. Ingestion
        </h2>
        
        <label id="dropZone" for="fileInput" class="drop-zone flex flex-col items-center justify-center rounded-3xl p-10 cursor-pointer group hover:bg-indigo-50/10 transition-all">
          <div class="bg-indigo-100 dark:bg-indigo-900/30 p-5 rounded-2xl group-hover:scale-110 transition-transform">
            <svg class="w-10 h-10 text-indigo-600" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M7 16a4 4 0 01-.88-7.903A5 5 0 1115.9 6L16 6a5 5 0 011 9.9M15 13l-3-3m0 0l-3 3m3-3v12"/></svg>
          </div>
          <span class="mt-4 font-black text-slate-800 text-sm">Harkisi ykn Cuqaasi</span>
          <span class="text-[10px] text-slate-400 font-bold uppercase tracking-widest mt-1">PDF · DOCX · TXT</span>
          <input id="fileInput" class="sr-only" type="file" multiple accept=".pdf,.docx,.txt">
        </label>

        <div id="fileList" class="mt-6 space-y-2 max-h-48 overflow-y-auto custom-scrollbar"></div>
        
        <button id="processBtn" disabled class="w-full mt-6 bg-indigo-600 hover:bg-indigo-700 disabled:bg-slate-200 dark:disabled:bg-slate-800 text-white py-4 rounded-2xl font-black uppercase text-xs tracking-widest shadow-lg transition-all active:scale-[0.98]">
          Execute X20 Extraction
        </button>

        <div id="status" class="mt-4 hidden p-4 rounded-2xl text-[10px] font-bold border animate-in fade-in zoom-in duration-300"></div>
      </div>

      <div class="bg-slate-900 rounded-[2rem] p-8 text-white shadow-2xl">
        <h3 class="text-[10px] font-black uppercase tracking-[.3em] text-indigo-400 mb-6">Archive Operations</h3>
        <div class="grid grid-cols-2 gap-3">
          <button id="jsonBtn" disabled class="bg-white/5 hover:bg-white/10 disabled:opacity-20 py-3 rounded-xl text-[10px] font-black uppercase transition-all border border-white/10">JSON Export</button>
          <button id="csvBtn" disabled class="bg-white/5 hover:bg-white/10 disabled:opacity-20 py-3 rounded-xl text-[10px] font-black uppercase transition-all border border-white/10">CSV Matrix</button>
        </div>
        <button id="dedupeBtn" disabled class="w-full mt-3 bg-indigo-600/20 hover:bg-indigo-600/40 text-indigo-300 py-3 rounded-xl text-[10px] font-black uppercase tracking-widest border border-indigo-500/20 transition-all">Scan for Duplicates</button>
      </div>
    </aside>

    <section class="lg:col-span-8 space-y-6">
      <div class="grid grid-cols-2 sm:grid-cols-4 gap-4">
        <div class="bg-white p-6 rounded-3xl border border-slate-200 shadow-sm">
          <div class="text-[9px] font-black uppercase text-slate-400 tracking-widest">Judicial Records</div>
          <div id="statCases" class="text-3xl font-black text-indigo-600 tabular-nums">0</div>
        </div>
        <div class="bg-white p-6 rounded-3xl border border-slate-200 shadow-sm">
          <div class="text-[9px] font-black uppercase text-slate-400 tracking-widest">Sources</div>
          <div id="statFiles" class="text-3xl font-black text-slate-800 tabular-nums">0</div>
        </div>
        <div class="bg-white p-6 rounded-3xl border border-slate-200 shadow-sm">
          <div class="text-[9px] font-black uppercase text-slate-400 tracking-widest">Classification</div>
          <div id="statCategories" class="text-3xl font-black text-indigo-600 tabular-nums">0</div>
        </div>
        <div class="bg-white p-6 rounded-3xl border border-slate-200 shadow-sm border-l-4 border-l-rose-500">
          <div class="text-[9px] font-black uppercase text-slate-400 tracking-widest">Duplicates</div>
          <div id="statDuplicates" class="text-3xl font-black text-rose-500 tabular-nums">0</div>
        </div>
      </div>

      <div class="bg-white rounded-[2.5rem] border border-slate-200 shadow-2xl overflow-hidden">
        <div class="p-8 border-b border-slate-100 flex flex-col gap-6 sm:flex-row sm:items-center sm:justify-between bg-white">
          <div>
            <h2 class="text-lg font-black uppercase tracking-tight text-slate-800">Precedent Intelligence Bench</h2>
            <p id="resultsNote" class="text-[10px] text-slate-400 font-bold uppercase tracking-widest mt-1">Ready for high-fidelity ingestion</p>
          </div>
          <div class="flex gap-3">
             <input id="searchInput" type="search" placeholder="Search extracted..." class="bg-slate-50 border border-slate-200 rounded-2xl px-5 py-3 text-sm focus:ring-2 focus:ring-indigo-500 outline-none w-full sm:w-64 transition-all" disabled>
             <select id="categoryFilter" class="bg-slate-50 border border-slate-200 rounded-2xl px-4 py-3 text-[10px] font-black uppercase text-slate-600 outline-none focus:ring-2 focus:ring-indigo-500" disabled>
               <option value="">All Categories</option>
             </select>
          </div>
        </div>

        <div id="caseList" class="p-8 space-y-6 max-h-[1200px] overflow-y-auto custom-scrollbar bg-slate-50/20">
          <div class="flex flex-col items-center justify-center py-32 text-center opacity-30">
             <div class="bg-slate-100 p-10 rounded-[3rem] mb-6">⚖️</div>
             <h3 class="text-sm font-black text-slate-400 uppercase tracking-[.4em]">Archive Empty</h3>
          </div>
        </div>
      </div>
    </section>
  </main>

<script>
(() => {
  'use strict';

  const CATEGORY_OPTIONS = [
    'ፍትሐ ብሔር ሥነ-ሥርዓት / Civil Procedure',
    'ፍርድ አፈፃፀም / Execution',
    'ማስረጃ / Evidence',
    'ይርጋ / Limitation',
    'ሥልጣን / Jurisdiction',
    'ይግባኝ / Appeal',
    'ውልና ንብረት / Contract & Property',
    'መሬት / Land',
    'አሠሪና ሠራተኛ / Labour',
    'ወንጀል / Criminal',
    'ቤተሰብና ውርስ / Family & Succession',
    'ንግድና ባንክ / Commercial & Banking',
    'አስተዳደር / Administrative',
    'ግብርና ታክስ / Tax & Customs',
    'Lease & Insurance',
    'Other / Unclassified'
  ];

  const state = { 
    selectedFiles: [], 
    documents: JSON.parse(localStorage.getItem('seeraai_docs') || '[]'),
    cases: JSON.parse(localStorage.getItem('seeraai_cases') || '[]'),
    isDark: localStorage.getItem('seeraai_theme') === 'dark'
  };

  const $ = (id) => document.getElementById(id);

  function setStatus(message, kind = 'info') {
    const el = $('status');
    el.className = 'mt-4 p-4 rounded-2xl text-[10px] font-bold leading-relaxed border animate-in fade-in zoom-in duration-300';
    const styles = {
      info: 'bg-indigo-50 text-indigo-700 border-indigo-100 dark:bg-indigo-900/20 dark:text-indigo-300',
      success: 'bg-emerald-50 text-emerald-800 border-emerald-100 dark:bg-emerald-900/20 dark:text-emerald-300',
      error: 'bg-rose-50 text-rose-800 border-rose-100 dark:bg-rose-900/20 dark:text-rose-300'
    };
    el.classList.add(...styles[kind].split(' '));
    el.textContent = message;
    el.classList.remove('hidden');
  }

  function saveToLocal() {
    localStorage.setItem('seeraai_docs', JSON.stringify(state.documents.slice(-5)));
    localStorage.setItem('seeraai_cases', JSON.stringify(state.cases.slice(-500)));
    localStorage.setItem('seeraai_theme', state.isDark ? 'dark' : 'light');
  }

  function updateTheme() {
    document.documentElement.classList.toggle('dark', state.isDark);
    $('themeToggle').textContent = state.isDark ? '☀️' : '🌙';
  }

  function renderSelectedFiles() {
    const list = $('fileList');
    list.replaceChildren();
    state.selectedFiles.forEach((file, index) => {
      const row = document.createElement('div');
      row.className = 'flex items-center justify-between gap-3 rounded-xl bg-slate-50 dark:bg-slate-800/50 px-4 py-3 border border-slate-100 dark:border-slate-700 group';
      row.innerHTML = `
        <div class="min-w-0">
          <div class="truncate text-[10px] font-black text-slate-700 dark:text-slate-300 uppercase">${file.name}</div>
          <div class="text-[8px] text-slate-400 font-mono">${(file.size / 1024).toFixed(1)} KB</div>
        </div>
        <button class="text-[10px] font-black uppercase text-rose-500 opacity-0 group-hover:opacity-100">Remove</button>
      `;
      row.querySelector('button').onclick = () => {
        state.selectedFiles.splice(index, 1);
        renderSelectedFiles();
      };
      list.append(row);
    });
    $('processBtn').disabled = state.selectedFiles.length === 0;
  }

  async function extractText(file) {
    const ext = file.name.split('.').pop().toLowerCase();
    if (ext === 'docx') {
      const result = await mammoth.extractRawText({ arrayBuffer: await file.arrayBuffer() });
      return result.value;
    }
    if (ext === 'pdf') {
       // Note: Using PDF.js would require more boilerplate, falling back to basic stream for standalone demo
       return "PDF Text Extraction would typically happen via PDF.js worker in production.";
    }
    return await file.text();
  }

  function classifyCase(text) {
    const s = text.toLowerCase();
    const map = {
      8: ['አሠሪ', 'ሠራተኛ', 'ሥራ', 'labour', 'employment'],
      9: ['ወንጀል', 'criminal', 'ወንጀለኛ'],
      10: ['ቤተሰብ', 'ፍቺ', 'ጋብቻ', 'ውርስ', 'succession', 'family'],
      6: ['ውል', 'ንብረት', 'ሽያጭ', 'contract', 'property']
    };
    for (const [idx, keys] of Object.entries(map)) {
      if (keys.some(k => s.includes(k))) return CATEGORY_OPTIONS[idx];
    }
    return CATEGORY_OPTIONS[15];
  }

  function parseEntries(text, fileName) {
    const entries = [];
    const blocks = text.split(/(?=\d{1,5}[\).])/);
    blocks.forEach(block => {
      const caseMatch = block.match(/(?:የመ\.ቁ\.|የመዝገብ ቁጥር|መዝገብ ቁ|መ\.ቁ)\s*(\d{4,6})/);
      const dateMatch = block.match(/([ሀ-ፐ]+)\s*(\d{1,2})\s*ቀን\s*([12][0-9]{3})/);
      if (caseMatch) {
        entries.push({
          id: btoa(fileName + caseMatch[1] + Math.random()),
          caseNumber: caseMatch[1],
          date: dateMatch ? dateMatch[0] : 'Unknown',
          summary: block.slice(0, 400).replace(/\s+/g, ' ').trim(),
          category: classifyCase(block),
          sourceFile: fileName,
          raw: block
        });
      }
    });
    return entries;
  }

  async function process() {
    setStatus('X20 Engine Initiated...', 'info');
    for (const file of state.selectedFiles) {
      const text = await extractText(file);
      const entries = parseEntries(text, file.name);
      state.documents.push({ name: file.name, count: entries.length });
      state.cases = [...state.cases, ...entries];
    }
    state.selectedFiles = [];
    saveToLocal();
    updateStats();
    renderCases();
    setStatus('Extraction Complete.', 'success');
  }

  function updateStats() {
    $('statFiles').textContent = state.documents.length;
    $('statCases').textContent = state.cases.length;
    $('statCategories').textContent = new Set(state.cases.map(c => c.category)).size;
    const nums = state.cases.map(c => c.caseNumber);
    $('statDuplicates').textContent = nums.length - new Set(nums).size;

    ['jsonBtn', 'csvBtn', 'searchInput', 'categoryFilter', 'dedupeBtn'].forEach(id => $(id).disabled = state.cases.length === 0);
  }

  function renderCases() {
    const list = $('caseList');
    list.replaceChildren();
    const query = $('searchInput').value.toLowerCase();
    const filter = $('categoryFilter').value;

    const filtered = state.cases.filter(c => {
      const mSearch = !query || [c.caseNumber, c.summary].some(s => s?.toLowerCase().includes(query));
      const mCat = !filter || c.category === filter;
      return mSearch && mCat;
    });

    filtered.forEach(c => {
      const card = document.createElement('div');
      card.className = 'case-card bg-white rounded-3xl border border-slate-200 p-6 shadow-sm hover:shadow-xl transition-all';
      card.innerHTML = `
        <div class="flex justify-between mb-4">
          <span class="bg-indigo-600 text-white px-3 py-1 rounded-full text-[9px] font-black uppercase">Case #${c.caseNumber}</span>
          <span class="text-[8px] font-bold text-slate-400 uppercase">${c.sourceFile}</span>
        </div>
        <p class="text-xs font-bold text-slate-800 leading-relaxed mb-4">${c.summary}</p>
        <div class="flex items-center justify-between border-t border-slate-50 pt-4">
          <span class="text-[9px] font-black text-indigo-400 uppercase tracking-widest">${c.category}</span>
          <button class="text-[9px] font-black text-slate-400 uppercase hover:text-indigo-600">Details</button>
        </div>
      `;
      list.append(card);
    });
  }

  $('themeToggle').onclick = () => { state.isDark = !state.isDark; updateTheme(); saveToLocal(); };
  $('fileInput').onchange = (e) => { state.selectedFiles = [...state.selectedFiles, ...e.target.files]; renderSelectedFiles(); };
  $('processBtn').onclick = process;
  $('searchInput').oninput = renderCases;
  $('categoryFilter').onchange = renderCases;
  $('clearBtn').onclick = () => { localStorage.clear(); location.reload(); };

  CATEGORY_OPTIONS.forEach(opt => $('categoryFilter').add(new Option(opt, opt)));
  updateTheme();
  updateStats();
  if (state.cases.length) renderCases();

})();
</script>
</body>
</html>
