<!DOCTYPE html>
<html lang="am" dir="ltr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SEERAAI PRO — Contract Precedent Portal X20</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script defer src="https://cdn.jsdelivr.net/npm/alpinejs@3.x.x/dist/cdn.min.js"></script>
    <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+Ethiopic:wght@400;700;900&family=Inter:wght@400;700;900&display=swap" rel="stylesheet">
    <style>
        body { font-family: 'Noto Sans Ethiopic', 'Inter', sans-serif; scroll-behavior: smooth; }
        [x-cloak] { display: none !important; }
        .judicial-gradient { background: linear-gradient(135deg, #020617 0%, #1e1b4b 100%); }
        .case-card { transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1); border-left: 6px solid transparent; }
        .case-card:hover { transform: translateX(6px); border-left-color: #6366f1; box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.25); }
        .highlight { background-color: #fde047; color: #1e1b4b; font-weight: 900; padding: 0 4px; border-radius: 4px; }
        .custom-scrollbar::-webkit-scrollbar { width: 4px; }
        .custom-scrollbar::-webkit-scrollbar-thumb { background: #6366f1; border-radius: 10px; }
    </style>
</head>
<body class="bg-slate-950 text-slate-100 min-h-screen flex flex-col selection:bg-indigo-500/30" x-data="contractPortal()">

    <!-- Toast Layer -->
    <div class="fixed bottom-10 right-10 z-[100] flex flex-col gap-4">
        <template x-for="toast in toasts" :key="toast.id">
            <div x-show="toast.show" x-transition class="bg-indigo-600 text-white px-8 py-5 rounded-3xl shadow-[0_0_40px_rgba(79,70,229,0.3)] border border-white/20 flex items-center gap-5">
                <div class="w-3 h-3 rounded-full bg-white animate-ping"></div>
                <span class="text-xs font-black uppercase tracking-[.2em]" x-text="toast.message"></span>
            </div>
        </template>
    </div>

    <header class="judicial-gradient text-white shadow-2xl sticky top-0 z-50 border-b border-white/5">
        <div class="max-w-[1600px] mx-auto px-8 py-6 flex flex-col xl:flex-row justify-between items-center gap-8">
            <div class="flex items-center gap-6">
                <div class="bg-indigo-500 p-4 rounded-[2rem] shadow-2xl ring-8 ring-indigo-500/10">
                    <svg class="w-8 h-8" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2.5" d="M9 12h6m-6 4h6m2 5H7a2 2 0 01-2-2V5a2 2 0 012-2h5.586a1 1 0 01.707.293l5.414 5.414a1 1 0 01.293.707V19a2 2 0 01-2 2z"/></svg>
                </div>
                <div>
                    <div class="text-[10px] font-black uppercase tracking-[.5em] text-indigo-400 mb-1">SEERAAI PRO — ELITE ARCHIVE</div>
                    <h1 class="text-2xl md:text-3xl font-black tracking-tighter">የውልና የሲቪል መዝገቦች ፖርታል</h1>
                </div>
            </div>

            <div class="flex items-center gap-4 w-full xl:w-auto">
                <div class="relative flex-grow xl:w-[600px]">
                    <input type="text" x-model="search" placeholder="Search precedents by ID, Party, or Ratio..." class="w-full px-8 py-5 rounded-[2rem] bg-white/5 border border-white/10 text-white placeholder-indigo-300/30 focus:outline-none focus:ring-4 focus:ring-indigo-500/20 transition-all focus:bg-white/10 text-sm">
                    <div class="absolute right-6 top-5 text-indigo-500/40">🔍</div>
                </div>
                <button @click="showStars = !showStars" :class="showStars ? 'bg-amber-500 text-slate-950 border-amber-400' : 'bg-white/5 text-white border-white/10'" class="px-8 py-5 rounded-[2rem] border font-black text-xs transition-all shadow-xl">⭐ <span x-text="stars.length"></span></button>
            </div>
        </div>
    </header>

    <main class="max-w-[1600px] mx-auto px-8 py-10 grid grid-cols-1 lg:grid-cols-12 gap-10 w-full flex-grow">
        <aside class="lg:col-span-3 space-y-8">
            <div class="bg-slate-900 p-8 rounded-[3rem] shadow-2xl border border-white/5 sticky top-32">
                <h2 class="font-black text-[11px] text-slate-500 uppercase tracking-[.4em] mb-8 flex items-center gap-3">
                    <span class="w-8 h-px bg-slate-800"></span> Categories
                </h2>
                <nav class="space-y-3 max-h-[50vh] overflow-y-auto pr-3 custom-scrollbar">
                    <button @click="category = ''" :class="category === '' ? 'bg-indigo-600 text-white shadow-2xl' : 'hover:bg-white/5 text-slate-400'" class="w-full text-left px-6 py-5 rounded-[2rem] transition-all flex justify-between items-center group">
                        <span class="text-xs font-black uppercase tracking-wider">Show All Archive</span>
                        <span class="text-[10px] font-mono opacity-40" x-text="totalCount"></span>
                    </button>
                    <template x-for="cat in categories" :key="cat">
                        <button @click="category = cat" :class="category === cat ? 'bg-indigo-600 text-white shadow-2xl' : 'hover:bg-white/5 text-slate-400'" class="w-full text-left px-6 py-5 rounded-[2rem] transition-all flex justify-between items-center">
                            <span class="text-xs font-bold truncate pr-3" x-text="cat"></span>
                            <span class="text-[10px] font-mono opacity-40" x-text="getCount(cat)"></span>
                        </button>
                    </template>
                </nav>
            </div>
        </aside>

        <section class="lg:col-span-9 space-y-8">
            <template x-for="item in filtered" :key="item.id">
                <article class="case-card bg-slate-900 rounded-[3rem] border border-white/5 overflow-hidden shadow-2xl">
                    <div class="px-10 py-8 bg-white/5 border-b border-white/5 flex flex-col xl:flex-row justify-between items-start gap-8">
                        <div class="space-y-4">
                            <div class="flex flex-wrap items-center gap-4">
                                <span class="bg-indigo-600 text-white text-[11px] font-black px-5 py-2 rounded-full uppercase tracking-tighter shadow-2xl ring-4 ring-indigo-600/10">መዝገብ <span x-text="item.case.lakk_galmee"></span></span>
                                <span class="bg-slate-800 text-slate-300 text-[11px] font-black px-5 py-2 rounded-full uppercase tracking-widest" x-text="item.category"></span>
                                <span class="text-[11px] font-bold text-slate-500 tracking-widest uppercase" x-text="'PAGE ' + item.case.fuula + ' • VOL ' + (item.case.fuula_jildii || '1')"></span>
                            </div>
                            <h3 class="font-black text-white text-2xl leading-tight tracking-tight" x-html="highlight(item.case.falmitoota)"></h3>
                        </div>
                        <div class="flex items-center gap-4">
                            <button @click="toggleStar(item.id)" :class="isStarred(item.id) ? 'bg-amber-500 text-slate-900 border-amber-400' : 'bg-white/5 text-slate-500 border-white/10'" class="p-5 rounded-[2rem] border shadow-2xl transition-all active:scale-90 text-xl">⭐</button>
                            <button @click="copyItem(item)" class="p-5 bg-indigo-600 text-white rounded-[2rem] shadow-2xl hover:bg-indigo-500 transition-all active:scale-90">
                                <svg class="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2.5" d="M8 5H6a2 2 0 00-2 2v12a2 2 0 002 2h10a2 2 0 002-2v-1M8 5a2 2 0 002 2h2a2 2 0 002-2M8 5a2 2 0 012-2h2a2 2 0 012 2m-3 8h3m-3 4h3m-6-4h.01M9 16h.01"/></svg>
                            </button>
                        </div>
                    </div>
                    <div class="p-12 space-y-10">
                        <div>
                            <h4 class="text-[11px] font-black text-indigo-400 uppercase tracking-[.4em] mb-6 flex items-center gap-3"><span class="w-8 h-px bg-indigo-500/30"></span> Ratio Decidendi</h4>
                            <p class="text-slate-300 text-xl leading-relaxed font-black italic tracking-tight" x-html="highlight(item.case.qabxii_ijoo)"></p>
                        </div>
                        <div class="p-10 bg-white/5 rounded-[2.5rem] border border-white/5 shadow-inner">
                            <h4 class="text-[11px] font-black text-indigo-500 uppercase tracking-[.4em] mb-4">Statutory Basis</h4>
                            <p class="text-indigo-300 text-lg font-black tracking-tight" x-html="highlight(item.case.seera_caqasame)"></p>
                        </div>
                    </div>
                </article>
            </template>
        </section>
    </main>

    <script>
        function contractPortal() {
            return {
                search: '', category: '', showStars: false,
                stars: JSON.parse(localStorage.getItem('seeraai_stars_elite') || '[]'),
                toasts: [],
                db: [
                    { category: "አሠሪና ሠራተኛ", murtiilee: [
                        {lakk_galmee: "18180", falmitoota: "የኬ.ኬ ብርድ ልብስ ፋብሪካ እና የኬ.ኬ ጨርቃ ጨርቅ", fuula: 5, qabxii_ijoo: "የአሰሪና ሰራተኛ ጉዳይ ቦርድ ስልጣን...", seera_caqasame: "አዋጅ ቁ. 42/85"},
                        {lakk_galmee: "14414", falmitoota: "የጊምቢ ከተማ አስተዳደር እና ወ/ሮ መረርቱ ፈቃዱ", fuula: 5, qabxii_ijoo: "በሕዝብ አስተዳደር አካል ውስጥ የሚሰራ ሰራተኛ...", seera_caqasame: "አዋጅ ቁ. 42/85"}
                    ]},
                    { category: "ውል", murtiilee: [
                        {lakk_galmee: "15493", falmitoota: "አቶ ጳውሎስ ሩምቾ እና ወ/ሮ ጫልቱ መርዳሳ", fuula: 112, qabxii_ijoo: "በህግ ግምት የሚሸፈንን የፍሬ ነገር ክርክር...", seera_caqasame: "የፍ/ብ/ህ/ቁ. 1845, 2024"},
                        {lakk_galmee: "15992", falmitoota: "የኪራይ ቤቶች አስተዳደር እና ወ/ት ሶስና አስፋው", fuula: 112, qabxii_ijoo: "በህግ የተደነገገው የውል አፃፃፍ ፎርም ውጤት...", seera_caqasame: "የፍ/ብ/ህ/ቁ. 1719, 1723"}
                    ]}
                ],
                get all() {
                    let l = [];
                    this.db.forEach(c => c.murtiilee.forEach(m => l.push({ id: btoa(c.category + m.lakk_galmee), category: c.category, case: m })));
                    return l;
                },
                get categories() { return this.db.map(d => d.category); },
                get totalCount() { return this.all.length; },
                getCount(cat) { return this.db.find(d => d.category === cat)?.murtiilee.length || 0; },
                get filtered() {
                    return this.all.filter(i => {
                        const mCat = !this.category || i.category === this.category;
                        const mStar = !this.showStars || this.isStarred(i.id);
                        const s = this.search.toLowerCase();
                        const mSearch = !s || [i.case.lakk_galmee, i.case.falmitoota, i.case.qabxii_ijoo].some(v => v.toLowerCase().includes(s));
                        return mCat && mStar && mSearch;
                    });
                },
                highlight(t) { return this.search ? t.replace(new RegExp(`(${this.search})`, 'gi'), '<span class="highlight">$1</span>') : t; },
                isStarred(id) { return this.stars.includes(id); },
                toggleStar(id) {
                    this.stars = this.isStarred(id) ? this.stars.filter(s => s !== id) : [...this.stars, id];
                    localStorage.setItem('seeraai_stars_elite', JSON.stringify(this.stars));
                    this.showToast(this.isStarred(id) ? 'Decision Starred' : 'Removed');
                },
                copyItem(i) {
                    const text = `Record: ${i.case.lakk_galmee}\nCategory: ${i.category}\nRatio: ${i.case.qabxii_ijoo}`;
                    navigator.clipboard.writeText(text).then(() => this.showToast('Archived to Clipboard'));
                },
                showToast(m) {
                    const id = Date.now();
                    this.toasts.push({ id, message: m, show: true });
                    setTimeout(() => this.toasts = this.toasts.filter(t => t.id !== id), 4000);
                }
            }
        }
    </script>
</body>
</html>
