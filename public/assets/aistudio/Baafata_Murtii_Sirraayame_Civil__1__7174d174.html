<!DOCTYPE html>
<html lang="am" dir="ltr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SEERAAI PRO — Federal Precedent Portal X20</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script defer src="https://cdn.jsdelivr.net/npm/alpinejs@3.x.x/dist/cdn.min.js"></script>
    <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+Ethiopic:wght@400;700;900&family=Inter:wght@400;700;900&display=swap" rel="stylesheet">
    <style>
        :root { --judicial-bg: #f8fafc; }
        body { font-family: 'Noto Sans Ethiopic', 'Inter', sans-serif; scroll-behavior: smooth; }
        .glass-header { backdrop-filter: blur(12px); background: rgba(15, 23, 42, 0.9); }
        .case-card { transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1); }
        .case-card:hover { transform: translateY(-4px); box-shadow: 0 20px 40px -12px rgba(0, 0, 0, 0.1); }
        .highlight { background-color: #fde047; color: #1e1b4b; padding: 0 2px; border-radius: 4px; font-weight: 800; }
        [x-cloak] { display: none !important; }
        .custom-scrollbar::-webkit-scrollbar { width: 4px; }
        .custom-scrollbar::-webkit-scrollbar-thumb { background: #6366f1; border-radius: 10px; }
    </style>
</head>
<body class="bg-slate-50 text-slate-900 min-h-screen flex flex-col" x-data="precedentPortal()">

    <!-- Toast Layer -->
    <div class="fixed bottom-8 right-8 z-[100] flex flex-col gap-3">
        <template x-for="toast in toasts" :key="toast.id">
            <div x-show="toast.show" x-transition class="bg-indigo-950 text-white px-6 py-4 rounded-2xl shadow-2xl border border-indigo-500/30 flex items-center gap-4">
                <div class="w-2 h-2 rounded-full bg-emerald-400 animate-pulse"></div>
                <span class="text-xs font-black uppercase tracking-widest" x-text="toast.message"></span>
            </div>
        </template>
    </div>

    <!-- Citation Modal -->
    <div x-show="citationModal" x-cloak class="fixed inset-0 z-[110] flex items-center justify-center p-6 bg-slate-900/60 backdrop-blur-sm">
        <div @click.away="citationModal = false" class="bg-white w-full max-w-lg rounded-[2.5rem] p-10 shadow-2xl animate-in zoom-in duration-200">
            <h3 class="text-xl font-black uppercase tracking-tight text-slate-900 mb-2">Judicial Citation</h3>
            <p class="text-[10px] text-slate-400 font-bold uppercase tracking-widest mb-6">Generated by SEERAAI Intelligence</p>
            
            <div class="bg-slate-50 p-6 rounded-3xl border border-slate-100 font-mono text-sm text-slate-700 leading-relaxed break-words" x-text="currentCitation"></div>
            
            <div class="mt-8 flex gap-3">
                <button @click="copyCitation()" class="flex-grow bg-indigo-600 text-white py-4 rounded-2xl font-black uppercase text-[10px] tracking-widest shadow-lg active:scale-95 transition-all">Copy Citation</button>
                <button @click="citationModal = false" class="px-8 py-4 rounded-2xl border border-slate-200 font-black uppercase text-[10px] tracking-widest">Close</button>
            </div>
        </div>
    </div>

    <header class="glass-header text-white sticky top-0 z-50 border-b border-indigo-500/20">
        <div class="max-w-[1600px] mx-auto px-6 py-5 flex flex-col xl:flex-row justify-between items-center gap-6">
            <div class="flex items-center gap-5">
                <div class="bg-indigo-600 p-3 rounded-2xl shadow-lg ring-4 ring-indigo-600/20">
                    <svg class="w-8 h-8" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2.5" d="M3 6l3 1m0 0l-3 9a5.002 5.002 0 006.001 0M6 7l3 9M6 7l6-2m6 2l3-1m-3 1l-3 9a5.002 5.002 0 006.001 0M18 7l3 9m-3-9l-6-2m0-2v2m0 16V5m0 16H9m3 0h3"/></svg>
                </div>
                <div>
                    <div class="text-[10px] font-black uppercase tracking-[.4em] text-indigo-400">SEERAAI PRO ARCHIVE</div>
                    <h1 class="text-xl md:text-2xl font-black tracking-tighter">የሰበር ውሳኔዎች ፖርታል <span class="text-indigo-400 font-medium">(Vol 1 - 25)</span></h1>
                </div>
            </div>

            <div class="flex items-center gap-3 w-full xl:w-auto">
                <div class="relative flex-grow xl:w-[500px]">
                    <input type="text" x-model="search" placeholder="Search by Record ID, Party, or Law Section..." class="w-full px-6 py-4 rounded-2xl bg-white/5 border border-white/10 text-white placeholder-indigo-300/40 focus:outline-none focus:ring-2 focus:ring-indigo-500 transition-all focus:bg-white/10 text-sm">
                    <div class="absolute right-5 top-4.5 text-white/20">🔍</div>
                </div>
                <button @click="showStars = !showStars" :class="showStars ? 'bg-amber-500 text-slate-950' : 'bg-white/5 text-white'" class="px-5 py-4 rounded-2xl border border-white/10 font-black text-xs transition-all">⭐ <span x-text="stars.length"></span></button>
            </div>
        </div>
    </header>

    <main class="max-w-[1600px] mx-auto px-6 py-8 grid grid-cols-1 lg:grid-cols-12 gap-8 w-full flex-grow">
        <aside class="lg:col-span-3 space-y-6">
            <div class="bg-white p-6 rounded-[2.5rem] shadow-xl border border-slate-200 sticky top-32">
                <h2 class="font-black text-[10px] text-slate-400 uppercase tracking-widest mb-6 border-b border-slate-50 pb-4">Judicial Bench Categories</h2>
                <nav class="space-y-2 max-h-[50vh] overflow-y-auto pr-2 custom-scrollbar">
                    <button @click="category = ''" :class="category === '' ? 'bg-indigo-600 text-white shadow-xl' : 'hover:bg-slate-50 text-slate-600'" class="w-full text-left px-5 py-4 rounded-3xl transition-all flex justify-between items-center group">
                        <span class="text-sm font-black uppercase">Explore All</span>
                        <span class="text-[10px] font-mono opacity-50" x-text="totalCount"></span>
                    </button>
                    <template x-for="cat in categories" :key="cat">
                        <button @click="category = cat" :class="category === cat ? 'bg-indigo-600 text-white shadow-xl' : 'hover:bg-slate-50 text-slate-600'" class="w-full text-left px-5 py-4 rounded-3xl transition-all flex justify-between items-center">
                            <span class="text-sm font-bold truncate pr-3" x-text="cat"></span>
                            <span class="text-[10px] font-mono opacity-50" x-text="getCount(cat)"></span>
                        </button>
                    </template>
                </nav>
            </div>
        </aside>

        <section class="lg:col-span-9 space-y-6">
            <template x-for="item in filtered" :key="item.id">
                <article class="case-card bg-white rounded-[2.5rem] border border-slate-200 overflow-hidden shadow-sm">
                    <div class="px-8 py-7 bg-slate-50/30 border-b border-slate-100 flex flex-col md:flex-row justify-between items-start gap-6">
                        <div class="space-y-3">
                            <div class="flex flex-wrap items-center gap-3">
                                <span class="bg-indigo-600 text-white text-[10px] font-black px-4 py-1.5 rounded-full uppercase tracking-tighter shadow-md">መዝገብ <span x-text="item.case.lakk_galmee"></span></span>
                                <span class="bg-slate-800 text-white text-[10px] font-black px-4 py-1.5 rounded-full uppercase tracking-widest" x-text="item.category"></span>
                                <span class="text-[10px] font-bold text-slate-400 tracking-widest uppercase" x-text="'Page ' + item.case.fuula + ' • Vol ' + (item.case.fuula_jildii || '1')"></span>
                            </div>
                            <h3 class="font-black text-slate-900 text-xl leading-tight" x-html="highlight(item.case.falmitoota)"></h3>
                        </div>
                        <div class="flex items-center gap-3">
                            <button @click="toggleStar(item.id)" :class="isStarred(item.id) ? 'bg-amber-100 text-amber-600 border-amber-200' : 'bg-white text-slate-300 border-slate-200'" class="p-4 rounded-3xl border shadow-sm transition-all">⭐</button>
                            <button @click="openCitation(item)" class="p-4 bg-white text-slate-400 border border-slate-200 rounded-3xl shadow-sm hover:text-indigo-600 transition-all">📜</button>
                        </div>
                    </div>
                    <div class="p-10 space-y-8">
                        <div>
                            <h4 class="text-[10px] font-black text-indigo-400 uppercase tracking-widest mb-4 flex items-center gap-2"><span class="w-5 h-px bg-indigo-200"></span> Legal Principle</h4>
                            <p class="text-slate-700 text-lg leading-relaxed font-bold italic" x-html="highlight(item.case.qabxii_ijoo)"></p>
                        </div>
                        <div class="p-8 bg-indigo-50/30 rounded-[2rem] border border-indigo-100/50">
                            <h4 class="text-[10px] font-black text-indigo-500 uppercase tracking-widest mb-3">Statutory References</h4>
                            <p class="text-indigo-900 text-base font-black tracking-tight" x-html="highlight(item.case.seera_caqasame)"></p>
                        </div>
                    </div>
                </article>
            </template>
        </section>
    </main>

    <script>
        function precedentPortal() {
            return {
                search: '', category: '', showStars: false, citationModal: false, currentCitation: '',
                stars: JSON.parse(localStorage.getItem('seeraai_stars') || '[]'),
                toasts: [],
                db: [
                    { category: "አሠሪና ሠራተኛ", murtiilee: [
                        {lakk_galmee: "18180", falmitoota: "የኬ.ኬ ብርድ ልብስ ፋብሪካ እና የኬ.ኬ ጨርቃ ጨርቅ", fuula: 5, qabxii_ijoo: "የአሰሪና ሰራተኛ ጉዳይ ቦርድ ስልጣን...", seera_caqasame: "አዋጅ ቁ. 42/85"},
                        {lakk_galmee: "14414", falmitoota: "የጊምቢ ከተማ አስተዳደር እና ወ/ሮ መረርቱ ፈቃዱ", fuula: 5, qabxii_ijoo: "በሕዝብ አስተዳደር አካል ውስጥ የሚሰራ ሰራተኛ...", seera_caqasame: "አዋጅ ቁ. 42/85"}
                    ]},
                    { category: "ፍትሐ ብሄር ሥነ ሥርዓት", murtiilee: [
                        {lakk_galmee: "17361", falmitoota: "ወ/ሮ ጋዲሴ ኢርጌ እና ወ/ሮ ወርቅአንጥፉ በቀለ", fuula: 209, qabxii_ijoo: "በስነ-ስርዓት ህጉ የጊዜ ገደብ...", seera_caqasame: "የፍ/ብ/ሥ/ሥ/ህ/ቁ. 49"}
                    ]}
                ],
                get all() {
                    let l = [];
                    this.db.forEach(c => c.murtiilee.forEach(m => l.push({ id: btoa(c.category + m.lakk_galmee), category: c.category, case: m })));
                    return l;
                },
                get categories() { return this.db.map(d => d.category); },
                get totalCount() { return this.all.length; },
                getCount(cat) { return this.db.find(d => d.category === cat)?.murtiilee.length || 0; },
                get filtered() {
                    return this.all.filter(i => {
                        const mCat = !this.category || i.category === this.category;
                        const mStar = !this.showStars || this.isStarred(i.id);
                        const s = this.search.toLowerCase();
                        const mSearch = !s || [i.case.lakk_galmee, i.case.falmitoota, i.case.qabxii_ijoo].some(v => v.toLowerCase().includes(s));
                        return mCat && mStar && mSearch;
                    });
                },
                highlight(t) { return this.search ? t.replace(new RegExp(`(${this.search})`, 'gi'), '<span class="highlight">$1</span>') : t; },
                isStarred(id) { return this.stars.includes(id); },
                toggleStar(id) {
                    this.stars = this.isStarred(id) ? this.stars.filter(s => s !== id) : [...this.stars, id];
                    localStorage.setItem('seeraai_stars', JSON.stringify(this.stars));
                    this.showToast(this.isStarred(id) ? 'Decision Starred' : 'Removed');
                },
                openCitation(i) {
                    this.currentCitation = `Federal Cassation Court Decision, File No. ${i.case.lakk_galmee}, Vol. ${i.case.fuula_jildii || '1'}, Page ${i.case.fuula}. [Precedent on ${i.category}]`;
                    this.citationModal = true;
                },
                copyCitation() {
                    navigator.clipboard.writeText(this.currentCitation).then(() => {
                        this.showToast('Citation Copied');
                        this.citationModal = false;
                    });
                },
                showToast(m) {
                    const id = Date.now();
                    this.toasts.push({ id, message: m, show: true });
                    setTimeout(() => this.toasts = this.toasts.filter(t => t.id !== id), 3000);
                }
            }
        }
    </script>
</body>
</html>
